include:
  - .well-known
# Enquanto o Pages estiver em modo "branch master" (até a troca para Actions, WP-07), o Jekyll
# não publica o projeto Astro. Definir `exclude` substitui a lista padrão do Jekyll 3.10
# (Gemfile, Gemfile.lock, node_modules, vendor/*) e desliga o `exclude: [CNAME]` que o
# github-pages acrescenta só quando a lista é a padrão — por isso os defaults vão repetidos aqui.
exclude:
  - src
  - node_modules
  - package.json
  - package-lock.json
  - astro.config.mjs
  - dist
  - Gemfile
  - Gemfile.lock
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - CNAME
