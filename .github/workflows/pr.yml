name: PR

# Roda em **todo** PR e em push para `develop`/`master`.
#
# `plano` prova que o backlog está consistente. `site` gera o site com o Astro (`npm run build` →
# `dist/`, ADR-002) e roda sobre `dist/` o `check_site.py` (URLs contratuais, links, assets,
# metadados, datas legais, copy de jogo responsável), o contrato byte a byte, a validação de HTML
# e os links internos — o que é provado é o que seria publicado. A raiz do repositório não é mais
# verificada desde a fatia 6 do WP-08: uma URL contratual (`eclipsego-privacy.html`) só existe em
# `dist/`. `lighthouse` mede o desempenho de `dist/` contra tools/orcamento-lighthouse.json
# (WP-12, D20). Nada de deploy aqui: publicar é o `deploy.yml`, em push para `master`, e
# `develop → master` é decisão do usuário (`/release`).
#
# Fluxo `feat → develop → master` (decisoes.md D5): PR do WP mira `develop`; `develop → master` é
# publicação. Roda em PR contra as duas e em push direto nelas. Sem `paths:` no nível do
# workflow: `paths:` impede o workflow inteiro de disparar, e um check obrigatório por nome fica
# `pending` para sempre — trava o merge.
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

# Cancela execução anterior do mesmo PR quando chega push novo — não gasta Actions numa versão
# obsoleta do diff. Push tem grupo por commit: lá a execução é o registro da branch, e um grupo
# por ref descartaria o push que ficou na fila.
concurrency:
  group: pr-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # `name:` igual ao id: é o nome que `gh pr checks` e a proteção de branch mostram.
  plano:
    name: plano
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ESTADO.md em dia e plano consistente
        # python3 do runner basta: os scripts de tools/ só usam a biblioteca padrão.
        run: |
          python3 tools/gen_estado.py --check
          python3 tools/check_plano.py

  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # engines.node do package.json; html-validate 11.16.2 exige Node ^22.22.0.
          node-version: '22.22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build (Astro → dist/)
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: check_site.py (dist)
        # URLs contratuais (ADR-001), links e assets, metadados, datas legais e copy barrada, sobre
        # o publicado. As fontes legais (docs/*.md, src/content/legal/*.md) são lidas do repositório.
        run: python3 tools/check_site.py --raiz dist

      - name: Contrato do bolão byte a byte (D13)
        # Convite, assetlinks, og:image do convite e CNAME saem iguais ao publicado. Mudar um deles é
        # decisão do usuário: atualiza tools/contrato.sha256 no mesmo PR, com teste de link real.
        run: cd dist && sha256sum --quiet -c ../tools/contrato.sha256

      - name: Validação de HTML
        # Versão do lockfile. Regras em `.htmlvalidate.json` da raiz (vale para dist/); as
        # rebaixadas para aviso estão em achados-novos.md, destino WP-08.
        # Padrão entre aspas: quem expande é o html-validate, não o shell.
        run: npx html-validate 'dist/**/*.html'

      - name: Instalar lychee
        # Binário do release, versão e sha256 fixos — conferido antes de extrair.
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          set -euo pipefail
          ASSET=lychee-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p "$RUNNER_TEMP/lychee"
          cd "$RUNNER_TEMP/lychee"
          curl -sSfL -o "$ASSET" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${ASSET}"
          echo "${LYCHEE_SHA256}  ${ASSET}" | sha256sum -c -
          tar -xzf "$ASSET"
          echo "$RUNNER_TEMP/lychee/lychee-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Links internos (dist)
        # `--offline`: só links locais (rede externa daria falso vermelho). `docs/` não vai para
        # dist/. Padrão que não casa nada o lychee só avisa e sai verde — o `ls` falha antes se o
        # build não gerou as páginas.
        run: |
          set -euo pipefail
          ls dist/*.html dist/lotto-expert/sweepstake-invite/*.html > /dev/null
          lychee --offline --no-progress --root-dir "$GITHUB_WORKSPACE/dist" 'dist/**/*.html'

  # Orçamento de desempenho (WP-12, D20 B). Job separado: não atrasa o `site`, e o vermelho diz
  # de cara que o problema é desempenho. Não publica nada.
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build (Astro → dist/)
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Lighthouse (dist)
        # `lighthouse` 13.5.0 do lockfile, Chrome do runner. 9 páginas (uma por template, mais as
        # que medem diferente) × 3 runs; regras e bytes em tools/orcamento-lighthouse.json.
        run: python3 tools/lighthouse.py --raiz dist
