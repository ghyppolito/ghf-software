<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@font-face{font-family:Inter;src:url(fonts/InterVariable.woff2) format("woff2");font-weight:100 900;font-display:swap}body{margin:0;background:#0B1120}a{color:#F3F4F6}a:hover{color:#F3F4F6}</style></helmet>
<div style="--bg:#0B1120;--sf:#111827;--rs:#1A2335;--bd:#243046;--bd2:#5E6B85;--tx:#F3F4F6;--tx2:#C3C9D3;--mu:#97A0B0;--br:#3CC8D0;--ft:#0E1524;--r:12px;--rb:999px;--rc:8px;--sh:0 12px 32px rgba(0,0,0,.45);container-type:inline-size;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif">
  <dc-import name="Site Nav" mobile="{{ navMobile }}" hint-size="100%,64px"></dc-import>
  <main style="max-width:1216px;margin:0 auto;padding:clamp(40px,8cqi,112px) clamp(16px,2.6cqi,32px) clamp(48px,8cqi,112px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(32px,5cqi,72px);align-items:start">
    <div style="display:flex;flex-direction:column;gap:16px">
      <span style="font-size:14px;font-weight:600;color:var(--br);font-variant-numeric:tabular-nums">Erro 404</span>
      <h1 style="margin:0;font-size:clamp(30px,4.4cqi,52px);line-height:1.12;font-weight:700;letter-spacing:-0.025em;text-wrap:balance">Esta página não existe.</h1>
      <p style="margin:0;font-size:17px;line-height:27px;color:var(--tx2);max-width:46ch;text-wrap:pretty">O endereço pode ter sido digitado errado ou a página mudou. Os apps e as políticas de privacidade continuam nos mesmos endereços.</p>
      <p lang="en" style="margin:0;font-size:15px;line-height:24px;color:var(--mu)">This page doesn’t exist. The apps and privacy policies are listed here.</p>
      <a href="index.html" style="align-self:flex-start;margin-top:8px;min-height:48px;padding:0 22px;border:1px solid var(--bd2);border-radius:var(--rb);display:flex;align-items:center;font-size:15px;font-weight:600;color:var(--tx);text-decoration:none" style-hover="background:var(--rs)" style-focus="outline:2px solid var(--br);outline-offset:3px">Ir para o início</a>
    </div>
    <ul aria-label="Apps" style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;background:var(--sf)">
      <sc-for list="{{ apps }}" as="a" hint-placeholder-count="4">
        <li style="display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--bd);flex-wrap:wrap">
          <span style="width:40px;height:40px;border-radius:10px;overflow:hidden;flex:none;display:block"><img src="{{ a.fav }}" alt="" style="width:100%;height:100%;object-fit:cover;transform:scale(1.06)"></span>
          <a href="{{ a.href }}" style="flex:1;min-width:120px;min-height:44px;display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:var(--tx);text-decoration:none" style-hover="text-decoration:underline" style-focus="outline:2px solid var(--br);outline-offset:2px"><span style="width:8px;height:8px;border-radius:2px;background:{{ a.hex }}"></span>{{ a.name }}</a>
          <a href="{{ a.privacy }}" style="min-height:44px;display:flex;align-items:center;font-size:14px;color:var(--tx2);text-decoration:underline;text-decoration-color:var(--bd2);text-underline-offset:3px" style-focus="outline:2px solid var(--br);outline-offset:2px">Privacidade</a>
        </li>
      </sc-for>
    </ul>
  </main>
  <dc-import name="Site Footer" mobile="{{ mobile }}" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;w&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;360&quot;,&quot;768&quot;,&quot;1280&quot;],&quot;default&quot;:&quot;1280&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const APPS=[
 {name:'LottoExpert',fav:'assets/lottoexpert_favicon_v3.png',hex:'#A78BFA',href:'lottoexpert.html',privacy:'lottoexpert-privacy.html'},
 {name:'TopoWalk',fav:'assets/topo-walk.png',hex:'#E38A57',href:'topowalk.html',privacy:'topowalk-privacy.html'},
 {name:'Pole Position',fav:'assets/poleposition.png',hex:'#5FD47E',href:'poleposition.html',privacy:'poleposition-privacy.html'},
 {name:'EclipseGo',fav:'assets/eclipse-go-favicon.png',hex:'#EE737D',href:'eclipsego.html',privacy:'eclipsego-privacy.html'}];
class Component extends DCLogic {
  state={vw:typeof window!=='undefined'?window.innerWidth:1280};
  componentDidMount(){this.onR=()=>this.setState({vw:window.innerWidth});window.addEventListener('resize',this.onR);}
  componentWillUnmount(){window.removeEventListener('resize',this.onR);}
  renderVals(){const w=Number(this.props.w??this.state.vw);return {apps:APPS,mobile:w<700,navMobile:w<900};}
}
</script>
</body>
</html>
